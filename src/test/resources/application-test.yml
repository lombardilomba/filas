spring:
  application:
    name: filas-test

  datasource:
    # banco isolado por contexto de teste (evita colisão da DATABASECHANGELOG)
    url: jdbc:h2:mem:filas_${random.uuid};MODE=Oracle;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    contexts: test
    change-log: classpath:db/changelog-test/db.changelog-master.sql

  rabbitmq:
    listener:
      simple:
        auto-startup: false
        default-requeue-rejected: false
    admin:
      auto-startup: false

filas:
  queue:
    proposta: proposta.queue.test

logging:
  level:
    liquibase: info
    org.springframework.test.context: info
