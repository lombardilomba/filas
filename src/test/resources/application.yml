spring:
  datasource:
    url: jdbc:h2:mem:filas;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:db/changelog-test/db.changelog-master.sql
    contexts: test
  rabbitmq:
    listener:
      simple:
        auto-startup: false
        default-requeue-rejected: false
    admin:
      auto-startup: false
